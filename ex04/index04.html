<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
</head>
<body>
<h1>User Registration </h1>
<form action="#" methods="post">
    <div>
        <label for="fullname">Full name :</label>
        <input type="text" id="fullname" name="fullname" required minlength="3">
    </div>
    <br>
    <div>
        <label for="Email">Email Address :</label>
<input type="Email" id="Email" name="Email" required> 
    </div>
    <br>
    <div>
        <label for="Password">Password :</label>
        <input type="Password" id="Password" name="Password" required minlength="8">
    </div>
    <br>
    <div>
        <label>Preferred Contact Method :</label><br>
        <input type="radio" id="contact-email" name="contact_method" value="Email" required>
        <label for="contact-email">Email</label>
        <input type="radio" id="contact-phone" name="contact_method" value="Phone">
        <label for="contact-phone">Phone</label>
    </div>
    <br>
    <div>
        <label for="country">Country:</label>
        <select id="country" name="country" required>
            <option value="">-- select a country --</option>
            <option value="JOR">Jordan</option>
            <option value="ca">Canada</option>
            <option value="uk">United Kingdom</option>
            <option value="other">Other</option>
        </select>
    </div>
    <br>
    <div>
        <label for="bio">Bio / Comments:</label><br>
        <textarea id="bio" name="bio" rows"4" cols="50" minlength="10" required></textarea>   
    </div>
    <br>
    <div>
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions.</label>
    </div>
    <br>
    <div>
        <button type="submit">Register</button>
    </div>
    
    
</form>
</body>
</html>
